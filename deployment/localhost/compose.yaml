name: daynight-localhost

services:
  postgres:
    container_name: daynight-postgres
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: daynight
      POSTGRES_PASSWORD: daynight-local
      POSTGRES_DB: daynight
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, daynight, -d, daynight]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  gateway:
    container_name: daynight-gateway
    image: nginx:1.30.6-alpine3.24
    ports:
      - "127.0.0.1:${DAYNIGHT_PORT:-8787}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:80/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  server:
    container_name: daynight-server
    build:
      context: ../..
      dockerfile: deployment/localhost/Dockerfile
      args:
        DAYNIGHT_NPM_REGISTRY: ${DAYNIGHT_NPM_REGISTRY:-https://registry.npmjs.org/}
    network_mode: service:gateway
    environment:
      DAYNIGHT_DATABASE_URL: postgres://daynight:daynight-local@postgres:5432/daynight?sslmode=disable
      DAYNIGHT_LISTEN_ADDR: 127.0.0.1:8787
      DAYNIGHT_STORAGE_ROOT: /var/lib/daynight/storage
      DAYNIGHT_TASK_SYNC_OVERLAP: ${DAYNIGHT_TASK_SYNC_OVERLAP:-10s}
      DAYNIGHT_PUBLIC_ORIGIN: ${DAYNIGHT_PUBLIC_ORIGIN:?Set DAYNIGHT_PUBLIC_ORIGIN in deployment/localhost/.env}
      DAYNIGHT_UNIAUTH_URL: ${DAYNIGHT_UNIAUTH_URL:?Set DAYNIGHT_UNIAUTH_URL in deployment/localhost/.env}
      DAYNIGHT_UNIAUTH_APP_ID: ${DAYNIGHT_UNIAUTH_APP_ID:?Set DAYNIGHT_UNIAUTH_APP_ID in deployment/localhost/.env}
      DAYNIGHT_UNIAUTH_APP_SECRET: ${DAYNIGHT_UNIAUTH_APP_SECRET:?Set DAYNIGHT_UNIAUTH_APP_SECRET in deployment/localhost/.env}
      DAYNIGHT_UNIAUTH_CALLBACK_URL: ${DAYNIGHT_UNIAUTH_CALLBACK_URL:?Set DAYNIGHT_UNIAUTH_CALLBACK_URL in deployment/localhost/.env}
      DAYNIGHT_ALLOW_HTTP_TEST_ORIGIN: ${DAYNIGHT_ALLOW_HTTP_TEST_ORIGIN:-0}
      DAYNIGHT_ALLOW_LOOPBACK_HTTP: ${DAYNIGHT_ALLOW_LOOPBACK_HTTP:-0}
    volumes:
      - attachment-data:/var/lib/daynight/storage
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      gateway:
        condition: service_started
        restart: true
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8787/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  attachment-data:
