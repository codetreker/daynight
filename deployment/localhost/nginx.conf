user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    server {
        listen 80;
        proxy_pass 127.0.0.1:8787;
        proxy_timeout 1h;
    }
    server {
        listen 81;
        proxy_pass 127.0.0.1:8788;
        proxy_timeout 1h;
    }
}
