services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: daynight
      POSTGRES_PASSWORD: daynight-dev-ci
      POSTGRES_DB: daynight
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, daynight, -d, daynight]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  gateway:
    image: nginx:1.30.6-alpine3.24
    ports:
      - "127.0.0.1::80"
      - "127.0.0.1:${DAYNIGHT_DEV_CI_FIXTURE_PORT}:${DAYNIGHT_DEV_CI_FIXTURE_PORT}"
    volumes:
      - ../localhost/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:80/readyz"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  server:
    image: ${DAYNIGHT_DEV_CI_IMAGE:?Use deployment/dev-ci/run.sh}
    build:
      context: ../..
      dockerfile: deployment/localhost/Dockerfile
      args:
        DAYNIGHT_NPM_REGISTRY: ${DAYNIGHT_NPM_REGISTRY:-https://registry.npmjs.org/}
    network_mode: service:gateway
    env_file:
      - ${DAYNIGHT_DEV_CI_AUTH_ENV_FILE:?Use deployment/dev-ci/run.sh}
    environment:
      DAYNIGHT_DATABASE_URL: postgres://daynight:daynight-dev-ci@postgres:5432/daynight?sslmode=disable
      DAYNIGHT_LISTEN_ADDR: 127.0.0.1:8787
      DAYNIGHT_STORAGE_ROOT: /var/lib/daynight/storage
      DAYNIGHT_TASK_SYNC_OVERLAP: ${DAYNIGHT_TASK_SYNC_OVERLAP:-10s}
    volumes:
      - attachment-data:/var/lib/daynight/storage
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8787/readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 20s

  uniauth:
    image: ${DAYNIGHT_DEV_CI_IMAGE:?Use deployment/dev-ci/run.sh}
    network_mode: service:gateway
    user: "${DAYNIGHT_DEV_CI_FIXTURE_UID}:${DAYNIGHT_DEV_CI_FIXTURE_GID}"
    entrypoint: [/auth-fixture]
    environment:
      DAYNIGHT_FIXTURE_CALLBACK_URL: ${DAYNIGHT_UNIAUTH_CALLBACK_URL:-}
      DAYNIGHT_FIXTURE_DATABASE_PATH: /fixture/apps.db
      DAYNIGHT_FIXTURE_READY_FILE: /fixture/ready.json
      DAYNIGHT_FIXTURE_LISTEN_ADDRESS: "0.0.0.0:${DAYNIGHT_DEV_CI_FIXTURE_PORT}"
      DAYNIGHT_FIXTURE_PUBLIC_URL: "http://127.0.0.1:${DAYNIGHT_DEV_CI_FIXTURE_PORT}"
    volumes:
      - ${DAYNIGHT_DEV_CI_FIXTURE_BINARY}:/auth-fixture:ro
      - ${DAYNIGHT_DEV_CI_FIXTURE_DIRECTORY}:/fixture
    depends_on:
      gateway:
        condition: service_started
    stop_grace_period: 10s

volumes:
  postgres-data:
  attachment-data:
