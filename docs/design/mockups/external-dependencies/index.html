  background: #19233566;
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.task-detail-dialog {
  width: 960px;
  max-width: 100%;
  height: min(880px, calc(100dvh - 48px));
  max-height: min(880px, calc(100dvh - 48px));
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #e1e5ed;
  border-radius: 13px;
  background: #fff;
  box-shadow: 0 24px 90px #17244733;
  animation: task-detail-appear .2s ease-out;
}

.task-detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 16px 26px;
  color: #737d8e;
  gap: 15px;
  flex: none;
}
.task-detail-header h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12px; font-weight: 500; margin: 0; }
.task-detail-header .locale-preference { max-width: 100%; min-width: 0; }
.task-detail-close { height: 32px; width: 32px; padding: 0; flex: none; }
.task-detail-body { display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 0; min-width: 0; }
.task-detail-panels { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
.task-detail-tabs { display: flex; flex: none; gap: 22px; padding: 0 30px; border-bottom: 1px solid var(--line); margin-top: 18px; }
.task-detail-tab { border: 0; border-bottom: 2px solid transparent; padding: 10px 2px; background: transparent; color: #737d8e; font-size: 12px; cursor: pointer; }
.task-detail-tab[aria-selected=true] { color: #5555ad; border-bottom-color: #5c5ce0; font-weight: 550; }
.task-detail-tab:focus-visible { outline: 3px solid #8c8cf0; outline-offset: -3px; border-radius: 3px; }
.task-detail-panel { flex: 1; min-height: 0; min-width: 0; }
.task-detail-panel[hidden] { display: none; }
.task-detail-panel-overview { overflow: auto; overscroll-behavior: contain; }
.task-detail-panel-attachments { display: flex; overflow: hidden; padding: 24px 30px 30px; }
.task-detail-heading { padding: 24px 30px 0; flex: none; min-width: 0; }
.task-detail-id { font-size: 10px; color: #737d8e; margin-bottom: 8px; overflow-wrap: anywhere; }
.task-detail-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 25px; line-height: 1.45; font-weight: 650; letter-spacing: -.4px; margin: 0 0 13px; overflow-wrap: anywhere; }
.task-detail-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.task-detail-status, .task-detail-ready, .task-detail-blocked { display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; font-size: 10px; font-weight: 500; padding: 4px 8px; }
.task-detail-status-todo { background: #edf0f4; color: #667387; }
.task-detail-status-proposed { background: #f1ebf8; color: #8262a5; }
.task-detail-status-in_progress { background: #edf2ff; color: #4e74bd; }
.task-detail-status-done { background: #eaf5ef; color: #438365; }
.task-detail-ready { background: #eeeeff; color: #6060b1; }
.task-detail-blocked { background: #fff4e5; color: #946b34; }

.task-detail-approval { padding: 0 30px; }
.task-approval { border: 1px solid #e2dced; background: #faf8fd; border-radius: 7px; padding: 14px; margin-top: 19px; }
.task-approval h4 { margin: 0 0 7px; font-size: 11px; font-weight: 600; color: #71558e; }
.task-approval-description, .task-approval-message, .task-approval-error { font-size: 11px; line-height: 1.8; overflow-wrap: anywhere; color: #637087; }
.task-approval-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.task-approval-controls:empty { display: none; }
.task-approval-controls .button { font-size: 11px; padding: 7px 11px; }
.task-approval-message { margin-top: 10px; outline: none; }
.task-approval-error { color: #a05252; margin-top: 8px; }
.task-approval-confirmed { background: #f3f9f5; border-color: #d7e8de; }
.task-approval-confirmed h4 { color: #438365; }
.task-detail-read-error { padding: 15px 30px 0; color: #a05252; font-size: 11px; line-height: 1.8; }
.task-detail-read-error .button { margin-top: 8px; }

.task-detail-columns { display: grid; grid-template-columns: minmax(0, 1fr) 265px; gap: 30px; padding: 25px 30px 30px; }
.task-detail-main, .task-detail-aside { min-width: 0; }
.task-detail-section { border-top: 1px solid #edf0f4; padding-top: 18px; margin: 21px 0 0; }
.task-detail-section:first-child { margin-top: 0; }
.task-detail-section > h4 { font-size: 11px; color: #737d8e; font-weight: 550; margin: 0 0 11px; letter-spacing: .3px; }
.task-detail-description { white-space: pre-wrap; color: #637087; font-size: 12px; line-height: 1.9; overflow-wrap: anywhere; }
.task-detail-relations { list-style: none; margin: 0; padding: 0; }
.task-detail-relation { width: 100%; display: flex; gap: 8px; align-items: center; border: 1px solid #e9ecf2; background: #fff; border-radius: 6px; padding: 10px; text-align: left; margin: 7px 0; font-size: 11px; }
.task-detail-relation:hover { background: #f7f7fd; }
.task-detail-relation span:nth-child(2) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task-detail-relation-arrow { color: #747ca1; flex: none; }
.task-detail-relation-dot { width: 6px; height: 6px; background: #8f9bad; border-radius: 50%; flex: none; }
.task-detail-dot-done { background: #5d9b7e; }
.task-detail-dot-proposed { background: #9979ba; }
.task-detail-dot-in_progress { background: #6b8bcb; }
.task-detail-dot-todo { background: #97a2b2; }
.task-detail-metadata { font-size: 10px; line-height: 1.8; color: #737d8e; }
.task-detail-metadata > div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; }
.task-detail-metadata dt { flex: none; }
.task-detail-metadata dd { font-weight: 400; color: #68758b; text-align: right; margin: 0; min-width: 0; }
.task-detail-full-id { overflow-wrap: anywhere; }
.task-detail-footer { border-top: 1px solid var(--line); padding: 12px 26px; color: #737d8e; font-size: 10px; flex: none; line-height: 1.7; }
.task-detail-state { min-height: 0; flex: 1; overflow: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 13px; color: #637087; font-size: 12px; overflow-wrap: anywhere; }
.task-detail-state h3 { color: #45516a; font-size: 16px; margin: 0; }
.task-detail-retained { margin-top: 13px; color: #737d8e; font-size: 11px; line-height: 1.8; overflow-wrap: anywhere; }
.task-detail-stale { border: 1px solid #e7d7c2; background: #fffaf1; border-radius: 7px; padding: 13px; margin-top: 20px; color: #79623d; font-size: 11px; line-height: 1.8; }
.task-detail-stale .button { margin-top: 9px; font-size: 11px; }

.task-detail-pr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.task-detail-pr { border: 1px solid #e9ecf2; border-radius: 6px; padding: 12px 13px; min-width: 0; }
.task-detail-pr-title { font-size: 12px; font-weight: 550; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 21px; color: #344258; margin: 0 0 6px; }
.task-detail-pr-empty { color: #737d8e; font-weight: 400; font-style: italic; }
.task-detail-pr-url { font-size: 10px; line-height: 1.8; display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.task-detail-pr-label { font-size: 9px; color: #737d8e; flex: none; }
.task-detail-pr-value { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; color: #637087; }
.task-detail-pr-value[href] { color: #5c5cbd; text-decoration: underline; text-underline-offset: 3px; }
.task-detail-pr-value[href]:hover { color: #44449b; }
.task-detail-pr-external { font-size: 10px; flex: none; color: #747ca1; margin-left: auto; }
.task-detail-pr-pagination { margin: 0 0 13px; }
.task-detail-pr-range { font-size: 10px; color: #737d8e; line-height: 1.8; margin: 0 0 8px; }
.task-detail-pr-page-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-detail-pr-page-controls .button { font-size: 10px; padding: 6px 9px; }
.task-detail-pr-page-label { font-size: 10px; color: #737d8e; }
.task-detail-pr-page-select { font: inherit; font-size: 10px; min-width: 0; max-width: 110px; flex: 1; border: 1px solid #dce0e8; border-radius: 5px; padding: 6px; color: #344258; background: #fff; }
.task-detail-pr-page-select:focus-visible, .task-detail-section > h4:focus-visible { outline: 3px solid #8c8cf0; outline-offset: 3px; }

@keyframes task-detail-appear {
  from { transform: translateY(8px) scale(.985); opacity: .5; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

@media (max-width: 850px) {
  .task-detail-columns { grid-template-columns: minmax(0, 1fr) 225px; gap: 23px; }
}

@media (max-width: 600px) {
  .task-detail-backdrop { padding: 12px; }
  .task-detail-dialog { height: min(880px, calc(100dvh - 24px)); max-height: min(880px, calc(100dvh - 24px)); border-radius: 10px; }
  .task-detail-header { padding: 10px 12px; gap: 9px; }
  .task-detail-header .locale-control > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .task-detail-close { min-width: 36px; min-height: 36px; }
  .task-detail-heading { padding: 22px 19px 0; }
  .task-detail-approval { padding: 0 19px; }
  .task-detail-read-error { padding: 15px 19px 0; }
  .task-detail-title { font-size: 21px; }
  .task-detail-columns { display: block; padding: 20px 19px 24px; }
  .task-detail-aside { margin-top: 24px; }
  .task-detail-footer { padding: 8px 17px; }
  .task-detail-tabs { padding: 0 19px; }
  .task-detail-panel-attachments { padding: 14px 12px 16px; }
}

@media (max-height: 500px) {
  .task-detail-header { padding: 5px 16px; }
  .task-detail-header .locale-control select { padding: 4px 7px; }
  .task-detail-heading { padding: 8px 18px 0; display: flex; align-items: center; gap: 10px; }
  .task-detail-heading > .task-detail-id { display: none; }
  .task-detail-title { display: block; font-size: 17px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .task-detail-badges { flex: none; }
  .task-detail-retained { margin: 0; font-size: 9px; line-height: 1.5; }
  .task-detail-stale { margin: 0; padding: 4px 7px; font-size: 9px; }
  .task-detail-stale .button { margin-top: 2px; padding: 3px 5px; }
  .task-detail-tabs { margin-top: 5px; padding: 0 18px; }
  .task-detail-tab { padding: 7px 2px; }
  .task-detail-panel-attachments { padding: 9px 16px 10px; }
  .task-detail-footer { padding: 4px 16px; font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  .task-detail-dialog { animation: none; }
}

 for(const id of [...visibleIds].sort())graph.setNode(id,{width:220,height:height(id)});for(const e of edgesAmong(visibleIds))graph.setEdge(e.source,e.target,{});dagre.layout(graph);
 const nodes=[...visibleIds].map(id=>{const n=graph.node(id);return {id,x:n.x-110,y:n.y-n.height/2,width:220,height:n.height};});
 const edges=PrototypeRoutes.planDependencyRoutes(nodes.map(n=>({id:n.id,left:n.x,top:n.y,right:n.x+n.width,bottom:n.y+n.height})),edgesAmong(visibleIds).map(e=>({...e,points:graph.edge(e.source,e.target).points})));
 geometry={nodes,edges,width:graph.graph().width,height:graph.graph().height};
 $('world').style.width=`${geometry.width}px`;$('world').style.height=`${geometry.height}px`;$('edges').setAttribute('width',String(geometry.width));$('edges').setAttribute('height',String(geometry.height));
 const expansionButton=(id,direction)=>{const e=expansion(id,direction);return e.ids.length?`<button type="button" class="task-node-expand" data-expand="${id}" data-direction="${direction}" aria-label="展开${direction==='prerequisites'?'前置':'后续'} ${e.ids.length} 个任务"><span>展开${direction==='prerequisites'?'前置':'后续'} ${e.ids.length}</span><small>+${e.addedEdges} 条依赖${e.totalHidden>e.ids.length?' · 余'+(e.totalHidden-e.ids.length):''}</small></button>`:'<span></span>';};
 $('nodes').innerHTML=nodes.map(n=>{const t=byId.get(n.id),context=!mainIds.has(t.id);return `<div class="prototype-node" data-node="${t.id}" data-context="${context}" style="left:${n.x}px;top:${n.y}px;height:${n.height}px"><article class="task-node task-node-${t.status}${context?' task-node-external':''}"><button type="button" class="task-node-body" data-select="${t.id}" aria-pressed="false" aria-label="${escapeHtml(t.title)}，${labels[t.status]}${context?'，链外前置':''}，选择以高亮上游"><span class="task-node-meta"><span class="task-node-id">${t.id.slice(0,8)}</span></span><span class="task-node-title">${escapeHtml(t.title)}</span><span class="task-node-bottom"><span class="graph-status graph-status-${t.status}"><i></i>${labels[t.status]}</span>${blockedBy(t).length?'<span class="graph-blocked-badge">被阻塞</span>':''}</span>${context?'<span class="task-external-label">外部前置</span>':''}</button><button type="button" class="task-node-details" data-detail="${t.id}" aria-haspopup="dialog" aria-label="查看${escapeHtml(t.title)}的详情">详情</button>${n.height===136?`<div class="task-node-expansions">${expansionButton(t.id,'prerequisites')}${expansionButton(t.id,'successors')}</div>`:''}</article></div>`;}).join('');
 $('edges').innerHTML=`<defs>${['normal','highlighted','unrelated'].map(state=>`<marker id="arrow-${state}" markerWidth="16" markerHeight="16" viewBox="-10 -10 20 20" markerUnits="strokeWidth" orient="auto-start-reverse" refX="0" refY="0"><polyline points="-5,-4 0,0 -5,4 -5,-4" stroke="${state==='highlighted'?'#7777dc':'#a5adbd'}" fill="${state==='highlighted'?'#7777dc':'#a5adbd'}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></marker>`).join('')}</defs>`+edges.map(e=>{const route=PrototypeRoutes.compileDependencyRoute(e.points,e.external);return `<g class="prototype-edge-group" data-edge="${e.id}" data-source="${e.source}" data-target="${e.target}" data-external="${e.external}" data-context="${!mainIds.has(e.source)||!mainIds.has(e.target)}" data-inspection="normal" role="img" aria-label="${escapeHtml(byId.get(e.source).title)} → ${escapeHtml(byId.get(e.target).title)}，${e.external?'外部依赖':'普通依赖'}">${e.external?paintPieces(route):''}<path class="prototype-edge" d="${route.d}" stroke="${e.external?'none':'currentColor'}" marker-end="url(#arrow-normal)"/></g>`;}).join('');
 $('graph-summary').textContent=`${mainIds.size} 个链内任务 · ${allowedIds.size-mainIds.size} 个外部前置 · ${edgesAmong(allowedIds).length} 条依赖`;
 $('visibility-summary').textContent=`显示 ${visibleIds.size}/${allowedIds.size} 个任务 · ${edges.length}/${edgesAmong(allowedIds).length} 条依赖。通过卡片上的控件补齐隐藏邻居。`;
 $('reset-overview').disabled=visibleIds.size===baseline.size&&[...visibleIds].every(id=>baseline.has(id));
 if(initial)initialViewport();else applyTransform();paintInspection();
};
const applyTransform = () => {if(!$('world'))return;$('world').style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;$('zoom-label').textContent=`${Math.round(scale*100)}%`;};
const initialViewport = () => {const canvas=$('canvas');scale=Math.min(1,Math.max(.8,Math.min((canvas.clientWidth-64)/geometry.width,(canvas.clientHeight-64)/geometry.height)));const fits=geometry.width*scale<=canvas.clientWidth&&geometry.height*scale<=canvas.clientHeight;if(fits){panX=(canvas.clientWidth-geometry.width*scale)/2;panY=(canvas.clientHeight-geometry.height*scale)/2;}else{const root=geometry.nodes.find(n=>n.id===expandedRootId);const left=Math.min(...geometry.nodes.map(n=>n.x));panX=32-left*scale;panY=root.x===left?canvas.clientHeight/2-(root.y+root.height/2)*scale:32-Math.min(...geometry.nodes.filter(n=>n.x===left).map(n=>n.y))*scale;}applyTransform();};
const fit = () => {const canvas=$('canvas');scale=Math.min(1,Math.max(.2,Math.min((canvas.clientWidth-48)/geometry.width,(canvas.clientHeight-48)/geometry.height)));panX=(canvas.clientWidth-geometry.width*scale)/2;panY=(canvas.clientHeight-geometry.height*scale)/2;applyTransform();};
const zoom = factor => {const canvas=$('canvas'),next=Math.max(.2,Math.min(1.8,scale*factor));panX=canvas.clientWidth/2-(canvas.clientWidth/2-panX)*next/scale;panY=canvas.clientHeight/2-(canvas.clientHeight/2-panY)*next/scale;scale=next;applyTransform();};
const paintInspection = () => {
 const upstream=selectedId===null?new Set():ancestors(selectedId);const highlighted=new Set(upstream);if(selectedId!==null)highlighted.add(selectedId);
 document.querySelectorAll('[data-node]').forEach(node=>{const id=node.dataset.node,article=node.firstElementChild;for(const kind of ['selected','prerequisite','unrelated'])article.classList.remove(`task-node-${kind}`);if(selectedId!==null)article.classList.add(`task-node-${id===selectedId?'selected':upstream.has(id)?'prerequisite':'unrelated'}`);node.querySelector('[data-select]').setAttribute('aria-pressed',String(selectedId===id));});
 document.querySelectorAll('[data-edge]').forEach(edge=>{const kind=selectedId===null?'normal':highlighted.has(edge.dataset.source)&&highlighted.has(edge.dataset.target)?'highlighted':'unrelated';edge.dataset.inspection=kind;edge.querySelector('.prototype-edge').setAttribute('marker-end',`url(#arrow-${kind})`);});
 const hidden=[...upstream].filter(id=>!visibleIds.has(id)).length;$('selection-summary').textContent=selectedId===null?'未选择任务':`已选择「${byId.get(selectedId).title}」 · ${upstream.size} 个前置${hidden?' · '+hidden+' 个前置尚未显示':''}`;
};
const render = () => {$('project-title').textContent=fixtures[currentFixture].title;$('classification').disabled=currentFixture!=='worker'||['loading','error','empty'].includes(scenario);$('classification').textContent=classificationCleared?'演示：恢复外部标识':'演示：取消外部标识';$('refresh').disabled=scenario==='loading';renderStats();renderList();};
const relationHtml = (id,external) => {const t=byId.get(id);return `<button type="button" class="task-detail-relation" data-detail="${id}"><i class="task-detail-relation-dot task-detail-dot-${t.status}"></i><span>${escapeHtml(t.title)}</span><span class="prototype-relation-kind${external?' external':''}">${external?'外部':'普通'}</span><span class="task-detail-relation-arrow">›</span></button>`;};
const renderDetail = () => {
 const t=byId.get(detailId),content=$('detail-content');
 if(detailMode!=='ready'){content.innerHTML=`<div class="task-detail-state prototype-detail-state">${detailMode==='loading'?'<i class="spinner"></i><h3>正在读取任务…</h3>':'<h3>任务详情读取失败</h3><p>当前请求未能完成，请重试。</p><p class="request-id">请求 ID：demo-detail-001</p><button type="button" class="button" id="retry-detail">重试</button>'}</div>`;return;}
 content.innerHTML=`<div class="task-detail-heading"><div class="task-detail-id">任务 ${escapeHtml(t.id)}</div><h3 class="task-detail-title">${escapeHtml(t.title)}</h3><div class="task-detail-badges"><span class="task-detail-status task-detail-status-${t.status}">${labels[t.status]}</span>${blockedBy(t).length?`<span class="task-detail-blocked">${blockedBy(t).length} 个前置未完成</span>`:isReady(t)?'<span class="task-detail-ready">已就绪</span>':''}</div></div><div class="task-detail-tabs" role="tablist" aria-label="任务详情视图"><button type="button" class="task-detail-tab" role="tab" aria-selected="true" data-detail-tab="overview">概览</button><button type="button" class="task-detail-tab" role="tab" aria-selected="false" data-detail-tab="attachments">附件</button></div><div class="task-detail-panel task-detail-panel-overview" id="detail-overview"><div class="task-detail-columns"><div class="task-detail-main"><section class="task-detail-section"><h4>描述</h4><div class="task-detail-description"><p>交付这项任务描述的具体行为，并满足全部真实前置。</p><h3>完成条件</h3><ul><li>普通依赖与外部依赖均按真实状态参与就绪和阻塞判断。</li><li>外部依赖保留其执行要求，同时保持任务链边界清楚。</li><li>任务链进度只统计当前链的成员。</li></ul><p>查看前置任务可以沿关系继续阅读；关闭详情后保留当前画布和选择。</p></div></section><section class="task-detail-section"><h4>关联 Pull Request</h4><p class="prototype-context-hint">暂无关联 Pull Request。</p></section></div><aside class="task-detail-aside"><section class="task-detail-section"><h4>前置任务（${t.dependsOn.length}）</h4><p class="prototype-context-hint">“外部”表示跨任务链前置，同样需要完成。</p>${t.dependsOn.length?t.dependsOn.map(id=>relationHtml(id,t.externalDependsOn.includes(id))).join(''):'<p class="prototype-context-hint">没有前置任务。</p>'}</section><section class="task-detail-section"><h4>后续任务（${successors(t.id).length}）</h4>${successors(t.id).length?successors(t.id).map(id=>relationHtml(id,byId.get(id).externalDependsOn.includes(t.id))).join(''):'<p class="prototype-context-hint">没有后续任务。</p>'}</section><section class="task-detail-section"><h4>任务信息</h4><dl class="task-detail-metadata"><div><dt>创建于</dt><dd>2026/10/23 10:00</dd></div><div><dt>更新于</dt><dd>2026/10/23 11:00</dd></div><div><dt>版本</dt><dd>1</dd></div></dl></section></aside></div></div><div class="task-detail-panel" id="detail-attachments" hidden><div class="task-detail-state"><h3>暂无附件</h3><p>这项演示任务没有附件。</p></div></div>`;
};
const focusables = element => [...element.querySelectorAll('button:not(:disabled),a[href],select,input,[tabindex="0"]')].filter(node=>node.getClientRects().length&&!node.closest('[hidden]'));
const openDetail = (id,trigger,mode='ready') => {if($('detail-backdrop').hidden)lastDetailTrigger=trigger;detailId=id;detailMode=mode;$('detail-backdrop').hidden=false;$('app').inert=true;document.querySelector('.prototype-tools').inert=true;document.body.classList.add('prototype-no-scroll');renderDetail();$('close-detail').focus();announce(`已打开${byId.get(id).title}的详情`);};
const closeDetail = () => {$('detail-backdrop').hidden=true;$('app').inert=false;document.querySelector('.prototype-tools').inert=isFullscreen;document.body.classList.toggle('prototype-no-scroll',isFullscreen);const trigger=lastDetailTrigger?.isConnected?lastDetailTrigger:document.querySelector(`[data-root="${expandedRootId}"]`);trigger?.focus({preventScroll:true});detailId=null;};
const fullscreen = () => {isFullscreen=!isFullscreen;$('graph').classList.toggle('task-graph-fullscreen',isFullscreen);$('fullscreen').textContent=isFullscreen?'⛶ 退出全屏':'⛶ 全屏查看';$('fullscreen').setAttribute('aria-pressed',String(isFullscreen));document.querySelector('.prototype-tools').inert=isFullscreen;document.body.classList.toggle('prototype-no-scroll',isFullscreen);requestAnimationFrame(()=>$('fullscreen').focus({preventScroll:true}));};
const revealFocused = target => {const node=target.closest('[data-node]');if(!node||!target.matches(':focus-visible'))return;const n=geometry.nodes.find(n=>n.id===node.dataset.node),canvas=$('canvas');if(panX+n.x*scale<0||panY+n.y*scale<0||panX+(n.x+n.width)*scale>canvas.clientWidth||panY+(n.y+n.height)*scale>canvas.clientHeight){panX=canvas.clientWidth/2-(n.x+n.width/2)*scale;panY=canvas.clientHeight/2-(n.y+n.height/2)*scale;applyTransform();}};
let fullscreenSiblings=[];
const syncFullscreenSiblings = active => {if(active){fullscreenSiblings=[];for(let node=$('graph');node&&node!==document.body;node=node.parentElement){for(const sibling of node.parentElement.children)if(sibling!==node&&sibling instanceof HTMLElement&&sibling.id!=='detail-backdrop'){fullscreenSiblings.push([sibling,sibling.inert]);sibling.inert=true;}}}else{for(const [node,inert] of fullscreenSiblings)node.inert=inert;fullscreenSiblings=[];}};
const toggleFullscreen = () => {if(isFullscreen)syncFullscreenSiblings(false);fullscreen();if(isFullscreen)syncFullscreenSiblings(true);};
document.addEventListener('click',event=>{
 const target=event.target.closest('button,a,input');if(!target)return;
 if(target.matches('[data-select]')){selectedId=selectedId===target.dataset.select?null:target.dataset.select;paintInspection();return;}
 if(target.matches('[data-detail]')){openDetail(target.dataset.detail,target);return;}
 if(target.matches('[data-root]')){const id=target.dataset.root;if(expandedRootId===id){expandedRootId=null;expandedWitnessId=null;clearProjection();savePreferences();renderList();}else{selectComponent(id);renderList();}return;}
 if(target.matches('[data-expand]')){const change=expansion(target.dataset.expand,target.dataset.direction);for(const id of change.ids)visibleIds.add(id);const anchor=target.dataset.expand;renderGraph(false);document.querySelector(`[data-select="${anchor}"]`).focus({preventScroll:true});announce(`已补充 ${change.ids.length} 个任务、${change.addedEdges} 条依赖`);return;}
 if(target.id==='reset-overview'){visibleIds=new Set(baseline);if(selectedId!==null&&!visibleIds.has(selectedId))selectedId=null;renderGraph(true);$('reset-overview').focus({preventScroll:true});return;}
 if(target.id==='fit'){fit();return;}if(target.id==='zoom-in'){zoom(1.2);return;}if(target.id==='zoom-out'){zoom(1/1.2);return;}
 if(target.id==='fullscreen'){toggleFullscreen();return;}if(target.id==='close-detail'){closeDetail();return;}
 if(target.id==='tab-chains'||target.id==='tab-standalone'){activeTab=target.id==='tab-chains'?'chains':'standalone';savePreferences();renderList();return;}
 if(target.id==='refresh'){render();announce('任务图已刷新');return;}
 if(target.id==='classification'){classificationCleared=!classificationCleared;load('worker');announce(classificationCleared?'已在演示数据中取消外部标识，普通依赖将三条链连通。':'已在演示数据中恢复外部标识，worker 与外部前置分别计算。');return;}
 if(target.id==='reset-demo'){scenario='worker';classificationCleared=false;$('scenario').value='worker';load('worker',true);return;}
 if(target.matches('[data-retry]')){scenario=currentFixture;$('scenario').value=currentFixture;render();announce('任务图读取成功');return;}
 if(target.id==='retry-detail'){detailMode='ready';renderDetail();$('close-detail').focus();return;}
 if(target.matches('[data-detail-tab]')){const overview=target.dataset.detailTab==='overview';$('detail-overview').hidden=!overview;$('detail-attachments').hidden=overview;document.querySelectorAll('[data-detail-tab]').forEach(button=>button.setAttribute('aria-selected',String(button===target)));return;}
});
document.addEventListener('change',event=>{if(event.target.id==='show-completed'){showCompleted=event.target.checked;savePreferences();renderList();$('show-completed').focus({preventScroll:true});}});
$('scenario').addEventListener('change',event=>{
 scenario=event.target.value;classificationCleared=false;const name=fixtures[scenario]?scenario:'worker';load(name,true);
 if(scenario==='empty'){tasks=[];byId=new Map();buildComponents();expandedRootId=null;expandedWitnessId=null;clearProjection();render();}
 if(scenario==='detail-loading'||scenario==='detail-error')openDetail('82bafb30-5c47-4b42-8e78-bb5b524c2ba4',event.target,scenario==='detail-loading'?'loading':'error');
 $('prototype-note').textContent=scenario==='worker'||scenario.startsWith('detail-')?'历史数据回归示例；操作仅改变本地演示数据。':'前端演示数据；操作不会修改真实任务。';
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){if(!$('detail-backdrop').hidden){event.preventDefault();closeDetail();}else if(isFullscreen){event.preventDefault();toggleFullscreen();}return;}
 const activeContainer=!$('detail-backdrop').hidden?$('detail-backdrop'):isFullscreen?$('graph'):null;
 if(event.key==='Tab'&&activeContainer){const controls=focusables(activeContainer),first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
 if(event.target.id==='tab-chains'||event.target.id==='tab-standalone'){if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const target=event.target.id==='tab-chains'?$('tab-standalone'):$('tab-chains');target.click();target.focus();}}
});
document.addEventListener('focusin',event=>{if(event.target instanceof HTMLElement&&event.target.closest('[data-node]'))revealFocused(event.target);});
document.addEventListener('pointerdown',event=>{const canvas=event.target.closest('#canvas');if(!canvas||event.target.closest('button')||event.button!==0)return;drag={x:event.clientX,y:event.clientY,panX,panY,moved:false};canvas.setPointerCapture(event.pointerId);});
document.addEventListener('pointermove',event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;panX=drag.panX+dx;panY=drag.panY+dy;applyTransform();});
document.addEventListener('pointerup',()=>{if(!drag)return;if(!drag.moved){selectedId=null;paintInspection();}drag=null;});
document.addEventListener('wheel',event=>{if(!event.target.closest('#canvas'))return;event.preventDefault();zoom(event.deltaY<0?1.1:1/1.1);},{passive:false});
window.addEventListener('resize',()=>{if($('canvas'))applyTransform();});
const initialFixture=localStorage.getItem('external-dependency-prototype:fixture')??'worker';scenario=initialFixture;$('scenario').value=initialFixture;load(initialFixture);
window.prototypeSnapshot=()=>({scenario,activeTab,expandedRootId,expandedWitnessId,mainIds:[...mainIds],visibleIds:[...visibleIds],contextIds:[...allowedIds].filter(id=>!mainIds.has(id)),components:components.map(c=>({representative:c.representative,members:[...c.ids],progress:c.progress})),selectedId,viewport:{scale,panX,panY},edges:edgesAmong(visibleIds),nodeSizes:geometry?.nodes.map(n=>({id:n.id,width:n.width,height:n.height}))});

</script></body></html>
