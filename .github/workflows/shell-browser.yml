name: shell and browser acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-completion:
    name: verify (shell completion)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Select official Ubuntu package archives
        run: sudo bash .github/scripts/use-ubuntu-archives.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Prepare isolated Bash 4.2 and zsh toolchains
        run: bash packages/daynight/scripts/prepare-completion-shells.sh
      - name: Verify completion behavior in all supported shells
        id: completion-module
        run: |
          pnpm build
          python3 -u packages/daynight/test/commands/completion/shell-module.py --shell all
      - name: Exercise actual Tab completion in Bash 4.2, modern Bash and zsh
        id: completion-validation
        run: pnpm completion:acceptance
      - name: Upload shell completion evidence
        if: ${{ always() && steps.completion-module.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-completion-acceptance
          path: |
            .tmp/completion-module-evidence.json
            .tmp/completion-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-web-browser:
    name: verify (web browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Install the locked Playwright Chromium browser
        run: pnpm --filter @codetreker/daynight-web exec playwright install --with-deps chromium
      - name: Verify frontend assistant browser regressions
        id: web-browser
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/packages/daynight-web/.tmp/acceptance/bots-viewport-results.xml
        run: pnpm --filter @codetreker/daynight-web exec playwright test --config tests/navigation/bots-viewport-playwright.config.ts --reporter=line,junit
      - name: Verify Session draft browser regressions
        id: session-drafts-browser
        run: pnpm --filter @codetreker/daynight-web exec playwright test --config tests/navigation/session-drafts-playwright.config.ts
      - name: Verify public native select browser regressions
        id: native-select-browser
        run: pnpm --filter @codetreker/daynight-web exec playwright test --config tests/navigation/native-select-playwright.config.ts
      - name: Upload frontend assistant browser evidence
        if: ${{ always() && steps.web-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-web-assistant-browser
          path: |
            packages/daynight-web/.tmp/acceptance/bots-viewport-results.xml
            packages/daynight-web/.tmp/acceptance/bots-viewport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload Session draft browser evidence
        if: ${{ always() && steps.session-drafts-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-web-session-drafts-browser
          path: |
            packages/daynight-web/.tmp/session-drafts-browser/results.json
            packages/daynight-web/.tmp/session-drafts-browser/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload public native select browser evidence
        if: ${{ always() && steps.native-select-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-web-native-select-browser
          path: |
            .tmp/native-select-browser/results.json
            .tmp/native-select-browser/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
