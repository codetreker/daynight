name: CLI focused evidence
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Unused
        required: true
        type: string
      expected_sha:
        description: Candidate commit
        required: true
        type: string
      expected_ref:
        description: Task branch
        required: true
        type: string
      comparison_group:
        description: Comparison identifier
        required: true
        type: string
      order:
        description: Order
        required: true
        type: choice
        options: [full-first, focused-first]
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.28.6
          run_install: false
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Compare original and candidate
        shell: bash
        env:
          CANDIDATE: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(uname -sm)" = 'Darwin arm64'
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          mkdir -p .tmp/successor-evidence/bin
          actual_git=$(command -v git)
          cat > .tmp/successor-evidence/bin/git <<'WRAPPER'
          #!/bin/bash
          printf '%s\n' "$*" >> "$DN_PROCESS_COUNT_FILE"
          exec "$ACTUAL_GIT" "$@"
          WRAPPER
          chmod +x .tmp/successor-evidence/bin/git
          export ACTUAL_GIT="$actual_git" PATH="$PWD/.tmp/successor-evidence/bin:$PATH"
          test_file=packages/daynight/test/commands/worker/worktrees.test.ts
          source_file=packages/daynight/src/commands/worker/worktrees.ts
          export DN_PROCESS_COUNT_FILE="$PWD/.tmp/successor-evidence/setup-git.log"
          "$actual_git" show "$CANDIDATE:$test_file" > .tmp/successor-evidence/candidate.ts
          "$actual_git" show "$CANDIDATE^:$test_file" > .tmp/successor-evidence/baseline.ts
          cp "$source_file" .tmp/successor-evidence/source.ts
          node --version | tee .tmp/successor-evidence/environment.txt
          pnpm --version | tee -a .tmp/successor-evidence/environment.txt
          "$actual_git" --version | tee -a .tmp/successor-evidence/environment.txt
          uname -a | tee -a .tmp/successor-evidence/environment.txt
          echo "candidate=$CANDIDATE baseline=$($actual_git rev-parse "$CANDIDATE^") runner=$RUNNER_NAME" | tee -a .tmp/successor-evidence/environment.txt
          for pair in 1 2 3; do
            if (( pair % 2 )); then order='baseline candidate'; else order='candidate baseline'; fi
            for variant in $order; do
              cp ".tmp/successor-evidence/$variant.ts" "$test_file"
              export DN_PROCESS_COUNT_FILE="$PWD/.tmp/successor-evidence/$pair-$variant-git.log"
              : > "$DN_PROCESS_COUNT_FILE"
              { time -p pnpm --filter @codetreker/daynight exec vitest run test/commands/worker/worktrees.test.ts -t 'recognizes a verified successor|does not treat a task branch registered outside'; } > ".tmp/successor-evidence/$pair-$variant.log" 2>&1
              cat ".tmp/successor-evidence/$pair-$variant.log"
              echo "pair=$pair variant=$variant git_processes=$(wc -l < "$DN_PROCESS_COUNT_FILE" | tr -d ' ')" | tee -a .tmp/successor-evidence/summary.txt
            done
          done
          node -e 'const fs=require("fs"); const p=process.argv[1]; const s=fs.readFileSync(p,"utf8"); const needle="      if (occupied.length !== 1) return false;"; if(s.split(needle).length!==2) throw Error("fault anchor not unique"); fs.writeFileSync(p,s.replace(needle,needle+"\n      return true;"));' "$source_file"
          for variant in baseline candidate; do
            cp ".tmp/successor-evidence/$variant.ts" "$test_file"
            export DN_PROCESS_COUNT_FILE="$PWD/.tmp/successor-evidence/fault-$variant-git.log"
            if pnpm --filter @codetreker/daynight exec vitest run test/commands/worker/worktrees.test.ts -t 'does not treat a task branch registered outside' > ".tmp/successor-evidence/fault-$variant.log" 2>&1; then exit 1; fi
            cat ".tmp/successor-evidence/fault-$variant.log"
            grep -q 'expected true to be false' ".tmp/successor-evidence/fault-$variant.log"
          done
          cp .tmp/successor-evidence/source.ts "$source_file"
          cp .tmp/successor-evidence/candidate.ts "$test_file"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: successor-native-evidence
          path: .tmp/successor-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
