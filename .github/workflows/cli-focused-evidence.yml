name: CLI focused evidence

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: string
      expected_sha:
        description: Exact candidate PR head (required for dispatch)
        required: true
        type: string
      expected_ref:
        description: Exact authorized task branch (required for dispatch)
        required: true
        type: string
      comparison_group:
        description: Source-bound comparison group identifier
        required: true
        type: string
      order:
        description: Interleaved native execution order
        required: true
        default: full-first
        type: choice
        options: [full-first, focused-first]

permissions:
  contents: read
  pull-requests: read

jobs:
  identity:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'cli-focused-evidence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
      number: ${{ steps.pr.outputs.number }}
      first: ${{ steps.pr.outputs.first }}
      second: ${{ steps.pr.outputs.second }}
      group: ${{ steps.pr.outputs.group }}
    steps:
      - name: Resolve current pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_REF: ${{ inputs.expected_ref }}
          COMPARISON_GROUP: ${{ inputs.comparison_group || 'label-comparison' }}
          COMPARISON_ORDER: ${{ inputs.order || 'full-first' }}
        shell: bash
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          sha=$(jq -er '.head.sha' <<< "$pr")
          ref=$(jq -er '.head.ref' <<< "$pr")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$EVENT_HEAD_SHA" || "$sha" == "$EVENT_HEAD_SHA" ]]
          [[ -z "$EVENT_HEAD_REF" || "$ref" == "$EVENT_HEAD_REF" ]]
          [[ "$COMPARISON_GROUP" =~ ^[A-Za-z0-9_-]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_REF" == daynight/* ]]
            [[ "$GITHUB_REF" == "refs/heads/$EXPECTED_REF" ]]
            [[ "$sha" == "$EXPECTED_SHA" && "$ref" == "$EXPECTED_REF" ]]
          fi
          full='{"include":[{"label":"linux-full","os":"ubuntu-latest","focused":"false","shard":""},{"label":"windows-full-1","os":"windows-latest","focused":"false","shard":"1/2"},{"label":"windows-full-2","os":"windows-latest","focused":"false","shard":"2/2"},{"label":"macos-full","os":"macos-15","focused":"false","shard":""}]}'
          focused='{"include":[{"label":"windows-focused-1","os":"windows-latest","focused":"true","shard":"1/2"},{"label":"windows-focused-2","os":"windows-latest","focused":"true","shard":"2/2"},{"label":"macos-focused","os":"macos-15","focused":"true","shard":""}]}'
          case "$COMPARISON_ORDER" in
            full-first) first=$full; second=$focused ;;
            focused-first) first=$focused; second=$full ;;
            *) exit 1 ;;
          esac
          printf 'first=%s\nsecond=%s\ngroup=%s\n' "$first" "$second" "$COMPARISON_GROUP" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\nref=%s\nnumber=%s\n' "$sha" "$ref" "$PR_NUMBER" >> "$GITHUB_OUTPUT"

  collect-first:
    name: CLI evidence (${{ matrix.label }})
    needs: identity
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.first) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15' && 20 || 10 }}
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      CLI_EVIDENCE_LABEL: ${{ matrix.label }}
      CLI_FOCUSED: ${{ matrix.focused }}
      PR_HEAD_SHA: ${{ needs.identity.outputs.sha }}
      PR_HEAD_REF: ${{ needs.identity.outputs.ref }}
      SHARD: ${{ matrix.shard }}
      CLI_COMPARISON_GROUP: ${{ needs.identity.outputs.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require macOS ARM64
        if: matrix.os == 'macos-15'
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64');"
      - run: pnpm build
      - name: Prepare evidence directory
        run: |
          node -e "require('node:fs').mkdirSync('.tmp/focused-evidence/' + process.env.CLI_EVIDENCE_LABEL, { recursive: true })"
      - name: Discover the complete ordinary collection
        env:
          CLI_FOCUSED: 'false'
        shell: bash
        run: pnpm --filter @codetreker/daynight exec vitest list --config vitest.focused-evidence.config.ts --filesOnly --json="../../.tmp/focused-evidence/$CLI_EVIDENCE_LABEL/discovered.json"
      - name: Validate the source-bound focused plan
        run: node .github/scripts/cli-focused-evidence.mts preflight .tmp/focused-evidence/${{ matrix.label }}/discovered.json
      - name: Execute the native collection
        id: test
        shell: bash
        run: |
          args=(--config vitest.focused-evidence.config.ts)
          if [[ -n "$SHARD" ]]; then args+=("--shard=$SHARD"); fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            node packages/daynight/scripts/observe-native-validation.mjs --signal-intents --output ".tmp/focused-evidence/$CLI_EVIDENCE_LABEL/native-validation" -- pnpm --filter @codetreker/daynight exec vitest run "${args[@]}"
          else
            pnpm --filter @codetreker/daynight exec vitest run "${args[@]}"
          fi
      - name: Record source identity and test outcome
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        env:
          CLI_TEST_RESULT: ${{ steps.test.outcome }}
        run: node .github/scripts/cli-focused-evidence.mts record ${{ matrix.label }}
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-focused-evidence-${{ matrix.label }}
          path: .tmp/focused-evidence/${{ matrix.label }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  collect-second:
    name: CLI evidence (${{ matrix.label }})
    needs: [identity, collect-first]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.second) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15' && 20 || 10 }}
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      CLI_EVIDENCE_LABEL: ${{ matrix.label }}
      CLI_FOCUSED: ${{ matrix.focused }}
      PR_HEAD_SHA: ${{ needs.identity.outputs.sha }}
      PR_HEAD_REF: ${{ needs.identity.outputs.ref }}
      SHARD: ${{ matrix.shard }}
      CLI_COMPARISON_GROUP: ${{ needs.identity.outputs.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require macOS ARM64
        if: matrix.os == 'macos-15'
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64');"
      - run: pnpm build
      - name: Prepare evidence directory
        run: |
          node -e "require('node:fs').mkdirSync('.tmp/focused-evidence/' + process.env.CLI_EVIDENCE_LABEL, { recursive: true })"
      - name: Discover the complete ordinary collection
        env:
          CLI_FOCUSED: 'false'
        shell: bash
        run: pnpm --filter @codetreker/daynight exec vitest list --config vitest.focused-evidence.config.ts --filesOnly --json="../../.tmp/focused-evidence/$CLI_EVIDENCE_LABEL/discovered.json"
      - name: Validate the source-bound focused plan
        run: node .github/scripts/cli-focused-evidence.mts preflight .tmp/focused-evidence/${{ matrix.label }}/discovered.json
      - name: Execute the native collection
        id: test
        shell: bash
        run: |
          args=(--config vitest.focused-evidence.config.ts)
          if [[ -n "$SHARD" ]]; then args+=("--shard=$SHARD"); fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            node packages/daynight/scripts/observe-native-validation.mjs --signal-intents --output ".tmp/focused-evidence/$CLI_EVIDENCE_LABEL/native-validation" -- pnpm --filter @codetreker/daynight exec vitest run "${args[@]}"
          else
            pnpm --filter @codetreker/daynight exec vitest run "${args[@]}"
          fi
      - name: Record source identity and test outcome
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        env:
          CLI_TEST_RESULT: ${{ steps.test.outcome }}
        run: node .github/scripts/cli-focused-evidence.mts record ${{ matrix.label }}
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-focused-evidence-${{ matrix.label }}
          path: .tmp/focused-evidence/${{ matrix.label }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify CLI focused evidence
    needs: [identity, collect-first, collect-second]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_HEAD_SHA: ${{ needs.identity.outputs.sha }}
      PR_HEAD_REF: ${{ needs.identity.outputs.ref }}
      PR_NUMBER: ${{ needs.identity.outputs.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test evidence verifier
        run: node --test .github/scripts/cli-focused-evidence.test.mts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-focused-evidence-*
          path: .tmp/downloaded-evidence
      - name: Arrange evidence by runner
        shell: bash
        run: |
          mkdir -p .tmp/focused-evidence
          for label in linux-full windows-full-1 windows-full-2 windows-focused-1 windows-focused-2 macos-full macos-focused; do
            mv ".tmp/downloaded-evidence/cli-focused-evidence-$label" ".tmp/focused-evidence/$label"
          done
      - name: Verify discovery, execution and native sentinels
        run: node .github/scripts/cli-focused-evidence.mts verify .tmp/focused-evidence
      - name: Require the pull request head to remain current
        shell: bash
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          [[ "$(jq -er '.head.sha' <<< "$pr")" == "$PR_HEAD_SHA" ]]
          [[ "$(jq -er '.head.ref' <<< "$pr")" == "$PR_HEAD_REF" ]]
