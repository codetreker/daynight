name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: detect affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image_pair_manifest_commit: ${{ steps.image-pairs.outputs.manifest_commit }}
      image_pair_combined_tree: ${{ steps.image-pairs.outputs.combined_tree }}
      image_pair_combined_commit: ${{ steps.image-pairs.outputs.combined_commit }}
      image_pair_production_tree: ${{ steps.image-pairs.outputs.production_tree }}
      cli: ${{ steps.modules.outputs.cli }}
      server: ${{ steps.modules.outputs.server }}
      web: ${{ steps.modules.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ vars.DAYNIGHT_IMAGE_TEST_PAIRS_COMMIT }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - name: Test module selection and job gates
        run: node --test .github/scripts/ci-modules.test.mts .github/scripts/checks.test.mts .github/scripts/image-test-pairs.test.mts
      - name: Select modules from the complete PR diff
        id: modules
        env:
          MODULE_EVENT: ${{ github.event_name }}
          MODULE_BASE: ${{ github.event.pull_request.base.sha }}
          MODULE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-modules.mts
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-detect-changes
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify (CLI tests, ${{ matrix.os }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Record native validation environment
        id: environment
        run: node packages/daynight/scripts/validation-environment.ts
      - run: pnpm typecheck
      - run: pnpm build
      - name: Test the local development installer
        run: pnpm dev:test
      - name: Test the compiled CLI
        run: pnpm --filter @codetreker/daynight exec vitest run
      - name: Pack the CLI for runtime compatibility checks
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @codetreker/daynight pack --out "${{ github.workspace }}/.tmp/daynight-runtime.tgz"
      - name: Upload the runtime compatibility package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-runtime-package
          path: .tmp/daynight-runtime.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload ordinary CLI environment
        if: ${{ always() && steps.environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-${{ matrix.os }}
          path: .tmp/validation-environment.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload native validation probe diagnostics
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-probes-${{ matrix.os }}
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-${{ matrix.os }}
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-installed:
    name: verify (installed CLI, ${{ matrix.os }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Record native validation environment
        id: environment
        run: node packages/daynight/scripts/validation-environment.ts
      - run: pnpm build
      - name: Verify the compiled CLI installation
        run: pnpm --filter @codetreker/daynight exec vitest run --config vitest.acceptance.config.ts
      - name: Upload acceptance evidence
        if: ${{ always() && steps.environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-${{ matrix.os }}
          path: |
            .tmp/validation-environment.json
            .tmp/e2e-evidence.json
            .tmp/update-evidence.json
            .tmp/project-task-evidence.json
            .tmp/skill-install-evidence.json
            .tmp/installed-cli-preparation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload native validation probe diagnostics
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-probes-${{ matrix.os }}
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-installed-${{ matrix.os }}
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-macos:
    name: verify (macOS ARM64)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - name: Install native CLI dependencies
        id: preparation
        run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require macOS ARM64
        id: architecture
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64', 'macOS validation requires ARM64');"
      - name: Record ordinary CLI environment
        id: ordinary-environment
        run: node packages/daynight/scripts/validation-environment.ts
      - name: Verify ordinary CLI
        id: ordinary-validation
        timeout-minutes: 10
        run: |
          pnpm typecheck
          pnpm build
          pnpm dev:test
          node packages/daynight/scripts/observe-native-validation.mjs --output .tmp/native-validation -- pnpm --filter @codetreker/daynight exec vitest run
      - name: Upload ordinary CLI environment
        if: ${{ always() && steps.ordinary-environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-macos-15
          path: .tmp/validation-environment.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload ordinary CLI probe diagnostics
        if: ${{ always() && steps.ordinary-environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-probes-macos-15
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload macOS test termination diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-termination-macos-15
          path: .tmp/native-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Clear installed CLI evidence paths
        id: installed-evidence
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' && steps.architecture.outcome == 'success' }}
        run: |
          node --input-type=module -e "import { rm } from 'node:fs/promises'; await Promise.all(['.tmp/validation-environment.json', '.tmp/validation-probes.json'].map((path) => rm(path, { force: true })));"
      - name: Record installed CLI environment
        id: installed-environment
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' && steps.architecture.outcome == 'success' && steps.installed-evidence.outcome == 'success' }}
        run: node packages/daynight/scripts/validation-environment.ts
      - name: Verify installed CLI
        id: installed-validation
        if: ${{ !cancelled() && steps.installed-environment.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          pnpm build
          pnpm --filter @codetreker/daynight exec vitest run --config vitest.acceptance.config.ts
      - name: Upload installed CLI acceptance evidence
        if: ${{ always() && steps.installed-environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-macos-15
          path: |
            .tmp/validation-environment.json
            .tmp/e2e-evidence.json
            .tmp/update-evidence.json
            .tmp/project-task-evidence.json
            .tmp/skill-install-evidence.json
            .tmp/installed-cli-preparation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload installed CLI probe diagnostics
        if: ${{ always() && steps.installed-evidence.outcome == 'success' && steps.installed-environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-probes-macos-15
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-macos
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-runtime:
    name: verify (Node.js ${{ matrix.node }})
    needs: [detect-changes, verify]
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 22, 24, node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-runtime-package
          path: .tmp/
      - name: Download runtime package pairing evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-ubuntu-latest
          path: .tmp/runtime-pair
      - name: Verify runtime package input identity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const producer = JSON.parse(readFileSync('.tmp/runtime-pair/image-test-pairs.json', 'utf8'));
          const consumer = JSON.parse(readFileSync('.tmp/image-test-pairs.json', 'utf8'));
          assert.equal(producer.schemaVersion, 1);
          assert.equal(consumer.schemaVersion, 1);
          for (const field of ['manifestCommit', 'combinedTree', 'combinedCommit', 'productionTree', 'head']) {
            assert.match(producer[field], /^[0-9a-f]{40}$/, `Runtime package ${field} must be a complete Git identity.`);
            assert.equal(producer[field], consumer[field], `Runtime package ${field} must match its checked test input.`);
          }
          NODE
      - name: Strictly install the packed CLI and its runtime dependencies
        run: |
          mkdir -p .tmp/runtime-consumer
          printf '{"private":true}\n' > .tmp/runtime-consumer/package.json
          npm install --prefix .tmp/runtime-consumer --engine-strict --no-audit --no-fund --package-lock=false "$GITHUB_WORKSPACE/.tmp/daynight-runtime.tgz"
      - name: Verify the installed CLI, SQLite and interactive prompts
        run: node packages/daynight/scripts/check-runtime.mjs .tmp/runtime-consumer/node_modules/@codetreker/daynight
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-runtime-${{ matrix.node }}
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-completion:
    name: verify (shell completion)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Select official Ubuntu package archives
        run: sudo bash .github/scripts/use-ubuntu-archives.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Prepare isolated Bash 4.2 and zsh toolchains
        run: bash packages/daynight/scripts/prepare-completion-shells.sh
      - name: Exercise actual Tab completion in Bash 4.2, modern Bash and zsh
        id: completion-validation
        run: pnpm completion:acceptance
      - name: Upload shell completion evidence
        if: ${{ always() && steps.completion-validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-completion-acceptance
          path: .tmp/completion-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-completion
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-server:
    name: verify (Go server)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-cache
      GOMODCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-mod
      GOPATH: ${{ github.workspace }}/packages/daynight-server/.tmp/go
      GOBIN: ${{ github.workspace }}/packages/daynight-server/.tmp/bin
      TMPDIR: ${{ github.workspace }}/packages/daynight-server/.tmp/tmp
      XDG_CONFIG_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/config
      XDG_CACHE_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/cache
      GOENV: "off"
      GOTOOLCHAIN: go1.27.2
      DAYNIGHT_TEST_RACE: ${{ github.event_name != 'pull_request' }}
      DAYNIGHT_TEST_DATABASE_URL: postgres://daynight:daynight-test@127.0.0.1:5432/daynight?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: daynight
