name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: detect affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cli: ${{ steps.modules.outputs.cli }}
      server: ${{ steps.modules.outputs.server }}
      api: ${{ steps.modules.outputs.api }}
      web: ${{ steps.modules.outputs.web }}
      e2e: ${{ steps.modules.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test module selection and job gates
        run: node --test .github/scripts/ci-modules.test.mts .github/scripts/checks.test.mts .github/scripts/windows-cli-shards.test.mts
      - name: Select modules from the complete PR diff
        id: modules
        env:
          MODULE_EVENT: ${{ github.event_name }}
          MODULE_BASE: ${{ github.event.pull_request.base.sha }}
          MODULE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-modules.mts

  verify:
    name: verify (CLI tests, ${{ matrix.os }}${{ matrix.suffix }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: ""
            suffix: ""
          - os: windows-latest
            shard: "1/2"
            suffix: "-shard-1"
          - os: windows-latest
            shard: "2/2"
            suffix: "-shard-2"
          - os: macos-15
            shard: ""
            suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15' && 15 || 10 }}
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require macOS ARM64
        if: matrix.os == 'macos-15'
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64', 'macOS validation requires ARM64');"
      - name: Record native validation environment
        id: environment
        run: node packages/daynight/scripts/validation-environment.ts
      - run: pnpm typecheck
      - run: pnpm build
      - name: Test the local development installer
        run: pnpm dev:test
      - name: Test the compiled CLI
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @codetreker/daynight exec vitest run
      - name: Discover the complete Windows CLI test collection
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @codetreker/daynight exec vitest list --config vitest.windows-shards.config.ts --filesOnly --json=../../.tmp/windows-cli-shard/discovered.json
      - name: Test the compiled CLI Windows shard
        id: windows-tests
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @codetreker/daynight exec vitest run --config vitest.windows-shards.config.ts --shard=${{ matrix.shard }}
      - name: Record the Windows shard source and test outcome
        if: ${{ always() && matrix.os == 'windows-latest' && steps.windows-tests.outcome != 'skipped' }}
        env:
          CLI_TEST_RESULT: ${{ steps.windows-tests.outcome }}
        run: node .github/scripts/windows-cli-shards.mts record ${{ matrix.shard }}
      - name: Test the compiled CLI with macOS termination diagnostics
        if: matrix.os == 'macos-15'
        run: node packages/daynight/scripts/observe-native-validation.mjs --signal-intents --output .tmp/native-validation -- pnpm --filter @codetreker/daynight exec vitest run
      - name: Pack the CLI for runtime compatibility checks
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @codetreker/daynight pack --out "${{ github.workspace }}/.tmp/daynight-runtime.tgz"
      - name: Upload the runtime compatibility package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-runtime-package
          path: .tmp/daynight-runtime.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload ordinary CLI environment
        if: ${{ always() && steps.environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-${{ matrix.os }}${{ matrix.suffix }}
          path: .tmp/validation-environment.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload native validation probe diagnostics
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-probes-${{ matrix.os }}${{ matrix.suffix }}
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload immediate CLI test failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-failures-${{ matrix.os }}${{ matrix.suffix }}
          path: .tmp/cli-test-failures/*.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Upload macOS test termination diagnostics
        if: ${{ always() && matrix.os == 'macos-15' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-termination-macos-15
          path: .tmp/native-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows shard discovery and execution results
        if: ${{ always() && matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-results-${{ matrix.os }}${{ matrix.suffix }}
          path: .tmp/windows-cli-shard/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-herdr-platform:
    name: verify (real Herdr, ${{ matrix.os }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - run: pnpm build
      - name: Download and verify pinned official native assets
        run: node packages/daynight/scripts/prepare-herdr-platform.mjs
      - name: Verify the original shell, native terminal and official Session hook
        id: herdr-platform
        working-directory: packages/daynight
        run: node node_modules/vitest/vitest.mjs run test/commands/worker/herdr-tool-platform.integration.test.ts test/commands/worker/herdr-windows-process-metadata-native.test.ts
      - name: Independently verify owned process and endpoint cleanup
        if: ${{ always() && steps.herdr-platform.outcome != 'skipped' }}
        run: node packages/daynight/scripts/check-herdr-platform-cleanup.mjs
      - name: Upload real Herdr platform evidence
        if: ${{ always() && steps.herdr-platform.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-herdr-platform-${{ matrix.os }}
          path: |
            .tmp/herdr-tools/research-platform/acceptance-*.json
            .tmp/herdr-tools/research-platform/cleanup.json
            .tmp/herdr-tools/research-platform/official-tools/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-installed:
    name: verify (installed CLI, ${{ matrix.os }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require macOS ARM64
        if: matrix.os == 'macos-15'
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64', 'macOS validation requires ARM64');"
      - name: Record native validation environment
        id: environment
        run: node packages/daynight/scripts/validation-environment.ts
      - run: pnpm build
      - name: Verify the compiled CLI installation
        run: pnpm --filter @codetreker/daynight exec vitest run --config vitest.acceptance.config.ts
      - name: Upload acceptance evidence
        if: ${{ always() && steps.environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-${{ matrix.os }}
          path: |
            .tmp/validation-environment.json
            .tmp/installed-cli-preparation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload native validation probe diagnostics
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-probes-${{ matrix.os }}
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-runtime:
    name: verify (Node.js ${{ matrix.node }})
    needs: [detect-changes, verify]
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 22, 24, node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-runtime-package
          path: .tmp/
      - name: Strictly install the packed CLI and its runtime dependencies
        run: |
          mkdir -p .tmp/runtime-consumer
          printf '{"private":true}\n' > .tmp/runtime-consumer/package.json
          npm install --prefix .tmp/runtime-consumer --engine-strict --no-audit --no-fund --package-lock=false "$GITHUB_WORKSPACE/.tmp/daynight-runtime.tgz"
      - name: Verify the installed CLI, SQLite and interactive prompts
        run: node packages/daynight/scripts/check-runtime.mjs .tmp/runtime-consumer/node_modules/@codetreker/daynight

  verify-server:
    name: verify (Go server)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-cache
      GOMODCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-mod
      GOPATH: ${{ github.workspace }}/packages/daynight-server/.tmp/go
      GOBIN: ${{ github.workspace }}/packages/daynight-server/.tmp/bin
      TMPDIR: ${{ github.workspace }}/packages/daynight-server/.tmp/tmp
      XDG_CONFIG_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/config
      XDG_CACHE_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/cache
      GOENV: "off"
      GOTOOLCHAIN: go1.27.2
      DAYNIGHT_TEST_DATABASE_URL: postgres://daynight:daynight-test@127.0.0.1:5432/daynight?sslmode=disable
      DAYNIGHT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: daynight
          POSTGRES_PASSWORD: daynight-test
          POSTGRES_DB: daynight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daynight -d daynight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: packages/daynight-server
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare module-local tool directories
        run: mkdir -p .tmp/go-cache .tmp/go-mod .tmp/go .tmp/bin .tmp/tmp .tmp/config .tmp/cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: packages/daynight-server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate Go module tests and coverage
        id: server-validation
        run: bash scripts/check.sh --coverage
      - name: Upload Go coverage evidence
        if: ${{ always() && steps.server-validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-server-acceptance
          path: |
            packages/daynight-server/coverage.out
            packages/daynight-server/.tmp/go-test-evidence/module/**/go-test.jsonl
            packages/daynight-server/.tmp/go-test-evidence/module/**/go-test.complete.json
            packages/daynight-server/.tmp/go-test-evidence/module/**/go-test.failed.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-server-startup-shutdown:
    name: verify (Go server startup & shutdown)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GOCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-cache
      GOMODCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-mod
      GOPATH: ${{ github.workspace }}/packages/daynight-server/.tmp/go
      GOBIN: ${{ github.workspace }}/packages/daynight-server/.tmp/bin
      TMPDIR: ${{ github.workspace }}/packages/daynight-server/.tmp/tmp
      XDG_CONFIG_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/config
      XDG_CACHE_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/cache
      GOENV: "off"
      GOTOOLCHAIN: go1.27.2
      DAYNIGHT_TEST_DATABASE_URL: postgres://daynight:daynight-test@127.0.0.1:5432/daynight?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: daynight
          POSTGRES_PASSWORD: daynight-test
          POSTGRES_DB: daynight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daynight -d daynight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: packages/daynight-server
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Prepare module-local tool directories
        timeout-minutes: 1
        run: mkdir -p .tmp/go-cache .tmp/go-mod .tmp/go .tmp/bin .tmp/tmp .tmp/config .tmp/cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 2
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: packages/daynight-server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate Go server startup and shutdown
        timeout-minutes: 8
        id: startup-shutdown
        run: bash scripts/startup-shutdown.sh
      - name: Upload Go startup and shutdown coverage
        timeout-minutes: 1
        if: ${{ always() && steps.startup-shutdown.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-server-startup-shutdown
          path: |
            packages/daynight-server/startup-shutdown-coverage.out
            packages/daynight-server/.tmp/go-test-evidence/startup-shutdown/**/go-test.jsonl
            packages/daynight-server/.tmp/go-test-evidence/startup-shutdown/**/go-test.complete.json
            packages/daynight-server/.tmp/go-test-evidence/startup-shutdown/**/go-test.failed.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-api-integration:
    name: verify (Go API integration)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-cache
      GOMODCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-mod
      GOPATH: ${{ github.workspace }}/packages/daynight-server/.tmp/go
      GOBIN: ${{ github.workspace }}/packages/daynight-server/.tmp/bin
      TMPDIR: ${{ github.workspace }}/packages/daynight-server/.tmp/tmp
      XDG_CONFIG_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/config
      XDG_CACHE_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/cache
      GOENV: "off"
      GOTOOLCHAIN: go1.27.2
      DAYNIGHT_TEST_DATABASE_URL: postgres://daynight:daynight-test@127.0.0.1:5432/daynight?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: daynight
          POSTGRES_PASSWORD: daynight-test
          POSTGRES_DB: daynight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daynight -d daynight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: packages/daynight-server
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Prepare module-local tool directories
        timeout-minutes: 1
        run: mkdir -p .tmp/go-cache .tmp/go-mod .tmp/go .tmp/bin .tmp/tmp .tmp/config .tmp/cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 2
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: packages/daynight-server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate API integration runtime tools
        timeout-minutes: 1
        run: node --test scripts/integration-runtime.test.mts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - name: Prepare production Web resources for API integration
        timeout-minutes: 7
        working-directory: .
        env:
          COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
          npm_config_devdir: ${{ github.workspace }}/.tmp/node-gyp
        run: |
          pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
          pnpm web:build
      - name: Validate normal Go API integration flows
        timeout-minutes: 20
        id: server-integration
        run: bash scripts/integration.sh
      - name: Reconcile owned API integration resources
        timeout-minutes: 3
        if: ${{ always() && steps.server-integration.outcome != 'skipped' }}
        run: bash scripts/integration.sh --cleanup
      - name: Upload Go API integration evidence
        timeout-minutes: 1
        if: ${{ always() && steps.server-integration.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-server-api-integration
          path: |
            packages/daynight-server/.tmp/integration-results/**/build.json
            packages/daynight-server/.tmp/integration-results/**/result.json
            packages/daynight-server/.tmp/integration-results/**/run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-web-quality:
    name: verify (web quality)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Verify Web types, production build, harness and coverage
        id: web-quality
        run: node packages/daynight-web/scripts/ci.mts quality
      - name: Upload complete web coverage evidence
        if: ${{ always() && steps.web-quality.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-web-coverage
          path: |
            packages/daynight-web/.tmp/coverage/coverage-final.json
            packages/daynight-web/.tmp/coverage/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-e2e:
    name: verify (product E2E)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
      DAYNIGHT_E2E_RUN_POINTER: ${{ github.workspace }}/.tmp/product-e2e-run.json
      GOCACHE: ${{ github.workspace }}/.tmp/product-e2e-cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.tmp/product-e2e-cache/go-mod
      GOPATH: ${{ github.workspace }}/.tmp/product-e2e-cache/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 2
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - name: Prepare product E2E build caches
        timeout-minutes: 1
        run: mkdir -p .tmp/product-e2e-cache/go-build .tmp/product-e2e-cache/go-mod .tmp/product-e2e-cache/go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: |
            packages/daynight-server/go.sum
            packages/e2e_tests/src/build.ts
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
        timeout-minutes: 3
      - name: Install the locked product E2E Chromium browser
        timeout-minutes: 4
        run: pnpm --filter @codetreker/daynight-e2e exec playwright install chromium
      - name: Verify product E2E types
        timeout-minutes: 1
        run: pnpm --filter @codetreker/daynight-e2e typecheck
      - name: Verify product E2E harness behavior
        timeout-minutes: 1
        run: pnpm e2e:test:harness
      - name: Verify the complete isolated product journey
        id: product-e2e
        timeout-minutes: 15
        run: pnpm e2e:test
      - name: Reconcile product E2E resources after execution
        if: ${{ always() && steps.product-e2e.outcome != 'skipped' }}
        timeout-minutes: 3
        run: pnpm e2e:cleanup
      - name: Upload product E2E evidence
        timeout-minutes: 1
        if: ${{ always() && steps.product-e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-product-e2e
          path: |
            .tmp/product-e2e/*/results/**
            .tmp/product-e2e/*/logs/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  checks:
    if: ${{ always() }}
    needs: [detect-changes, verify, verify-herdr-platform, verify-installed, verify-runtime, verify-server, verify-server-startup-shutdown, verify-api-integration, verify-web-quality, verify-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require preceding jobs to succeed or be skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(.[]; . == "success" or . == "skipped")' <<< "$JOB_RESULTS"
      - name: Require selected CLI jobs to succeed
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        env:
          CLI_RESULT: ${{ needs.verify.result }}
          HERDR_RESULT: ${{ needs.verify-herdr-platform.result }}
          INSTALLED_RESULT: ${{ needs.verify-installed.result }}
          RUNTIME_RESULT: ${{ needs.verify-runtime.result }}
        run: test "$CLI_RESULT" = success && test "$HERDR_RESULT" = success && test "$INSTALLED_RESULT" = success && test "$RUNTIME_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download Windows CLI shard 1
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-cli-tests-results-windows-latest-shard-1
          path: .tmp/windows-cli-shards/1
      - name: Download Windows CLI shard 2
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-cli-tests-results-windows-latest-shard-2
          path: .tmp/windows-cli-shards/2
      - name: Verify the complete Windows CLI execution
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        run: node .github/scripts/windows-cli-shards.mts verify .tmp/windows-cli-shards
      - name: Require selected Go server jobs to succeed
        if: ${{ needs.detect-changes.outputs.server == 'true' }}
        env:
          SERVER_RESULT: ${{ needs.verify-server.result }}
          STARTUP_SHUTDOWN_RESULT: ${{ needs.verify-server-startup-shutdown.result }}
        run: test "$SERVER_RESULT" = success && test "$STARTUP_SHUTDOWN_RESULT" = success
      - name: Require selected Go API integration to succeed
        if: ${{ needs.detect-changes.outputs.api == 'true' }}
        env:
          API_INTEGRATION_RESULT: ${{ needs.verify-api-integration.result }}
        run: test "$API_INTEGRATION_RESULT" = success
      - name: Require selected Web jobs to succeed
        if: ${{ needs.detect-changes.outputs.web == 'true' }}
        env:
          WEB_QUALITY_RESULT: ${{ needs.verify-web-quality.result }}
        run: test "$WEB_QUALITY_RESULT" = success
      - name: Require selected product E2E to succeed
        if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
        env:
          E2E_RESULT: ${{ needs.verify-e2e.result }}
        run: test "$E2E_RESULT" = success
