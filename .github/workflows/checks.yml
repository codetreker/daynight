          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: packages/daynight-server/go.sum
      - name: Verify isolated deployment lifecycle
        if: ${{ matrix.shard == 2 }}
        run: bash deployment/dev-ci/tests/run.sh
      - name: Select official Ubuntu package archives
        run: sudo bash .github/scripts/use-ubuntu-archives.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Verify production dashboard and container deployment
        id: web-acceptance
        env:
          IMAGE_PAIR_COMBINED_COMMIT: ${{ steps.image-pairs.outputs.combined_commit }}
        run: env GITHUB_SHA="$IMAGE_PAIR_COMBINED_COMMIT" node packages/daynight-web/scripts/ci.mts browser --shard=${{ matrix.shard }}/2
      - name: Recover recorded dashboard acceptance resources
        if: ${{ always() && steps.web-acceptance.outcome != 'skipped' }}
        env:
          IMAGE_PAIR_COMBINED_COMMIT: ${{ steps.image-pairs.outputs.combined_commit }}
        run: env GITHUB_SHA="$IMAGE_PAIR_COMBINED_COMMIT" node packages/daynight-web/scripts/acceptance.mts --cleanup
      - name: Verify attachment persistence and paired backup restoration
        if: ${{ matrix.shard == 2 }}
        run: node deployment/dev-ci/tests/attachments.mts
      - name: Upload production browser and cleanup evidence
        if: ${{ always() && steps.web-acceptance.outcome != 'skipped' }}
