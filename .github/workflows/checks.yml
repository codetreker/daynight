  verify-web:
    name: verify (web ${{ matrix.shard }}/2)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
