name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: detect affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image_pair_manifest_commit: ${{ steps.image-pairs.outputs.manifest_commit }}
      image_pair_combined_tree: ${{ steps.image-pairs.outputs.combined_tree }}
      image_pair_combined_commit: ${{ steps.image-pairs.outputs.combined_commit }}
      image_pair_production_tree: ${{ steps.image-pairs.outputs.production_tree }}
      cli: ${{ steps.modules.outputs.cli }}
      server: ${{ steps.modules.outputs.server }}
      web: ${{ steps.modules.outputs.web }}
      e2e: ${{ steps.modules.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - name: Test module selection and job gates
        run: node --test .github/scripts/ci-modules.test.mts .github/scripts/checks.test.mts .github/scripts/image-test-pairs.test.mts
      - name: Select modules from the complete PR diff
        id: modules
        env:
          MODULE_EVENT: ${{ github.event_name }}
          MODULE_BASE: ${{ github.event.pull_request.base.sha }}
          MODULE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-modules.mts
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-detect-changes
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify (CLI tests, ${{ matrix.os }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require macOS ARM64
        if: matrix.os == 'macos-15'
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64', 'macOS validation requires ARM64');"
      - name: Record native validation environment
        id: environment
        run: node packages/daynight/scripts/validation-environment.ts
      - run: pnpm typecheck
      - run: pnpm build
      - name: Test the local development installer
        run: pnpm dev:test
      - name: Test the compiled CLI
        if: matrix.os != 'macos-15'
        run: pnpm --filter @codetreker/daynight exec vitest run
      - name: Test the compiled CLI with macOS termination diagnostics
        if: matrix.os == 'macos-15'
        run: node packages/daynight/scripts/observe-native-validation.mjs --output .tmp/native-validation -- pnpm --filter @codetreker/daynight exec vitest run
      - name: Pack the CLI for runtime compatibility checks
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @codetreker/daynight pack --out "${{ github.workspace }}/.tmp/daynight-runtime.tgz"
      - name: Upload the runtime compatibility package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-runtime-package
          path: .tmp/daynight-runtime.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload ordinary CLI environment
        if: ${{ always() && steps.environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-${{ matrix.os }}
          path: .tmp/validation-environment.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload native validation probe diagnostics
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-probes-${{ matrix.os }}
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS test termination diagnostics
        if: ${{ always() && matrix.os == 'macos-15' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-tests-termination-macos-15
          path: .tmp/native-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-${{ matrix.os }}
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-installed:
    name: verify (installed CLI, ${{ matrix.os }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Require macOS ARM64
        if: matrix.os == 'macos-15'
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64', 'macOS validation requires ARM64');"
      - name: Record native validation environment
        id: environment
        run: node packages/daynight/scripts/validation-environment.ts
      - run: pnpm build
      - name: Verify the compiled CLI installation
        run: pnpm --filter @codetreker/daynight exec vitest run --config vitest.acceptance.config.ts
      - name: Upload acceptance evidence
        if: ${{ always() && steps.environment.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-${{ matrix.os }}
          path: |
            .tmp/validation-environment.json
            .tmp/installed-cli-preparation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload native validation probe diagnostics
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-cli-installed-probes-${{ matrix.os }}
          path: .tmp/validation-probes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-installed-${{ matrix.os }}
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-runtime:
    name: verify (Node.js ${{ matrix.node }})
    needs: [detect-changes, verify]
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 22, 24, node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-runtime-package
          path: .tmp/
      - name: Download runtime package pairing evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-ubuntu-latest
          path: .tmp/runtime-pair
      - name: Verify runtime package input identity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const producer = JSON.parse(readFileSync('.tmp/runtime-pair/image-test-pairs.json', 'utf8'));
          const consumer = JSON.parse(readFileSync('.tmp/image-test-pairs.json', 'utf8'));
          assert.equal(producer.schemaVersion, 1);
          assert.equal(consumer.schemaVersion, 1);
          for (const field of ['manifestCommit', 'combinedTree', 'combinedCommit', 'productionTree', 'head']) {
            assert.match(producer[field], /^[0-9a-f]{40}$/, `Runtime package ${field} must be a complete Git identity.`);
            assert.equal(producer[field], consumer[field], `Runtime package ${field} must match its checked test input.`);
          }
          NODE
      - name: Strictly install the packed CLI and its runtime dependencies
        run: |
          mkdir -p .tmp/runtime-consumer
          printf '{"private":true}\n' > .tmp/runtime-consumer/package.json
          npm install --prefix .tmp/runtime-consumer --engine-strict --no-audit --no-fund --package-lock=false "$GITHUB_WORKSPACE/.tmp/daynight-runtime.tgz"
      - name: Verify the installed CLI, SQLite and interactive prompts
        run: node packages/daynight/scripts/check-runtime.mjs .tmp/runtime-consumer/node_modules/@codetreker/daynight
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-runtime-${{ matrix.node }}
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-completion:
    name: verify (shell completion)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Select official Ubuntu package archives
        run: sudo bash .github/scripts/use-ubuntu-archives.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Prepare isolated Bash 4.2 and zsh toolchains
        run: bash packages/daynight/scripts/prepare-completion-shells.sh
      - name: Verify completion behavior in all supported shells
        run: |
          pnpm build
          python3 -u packages/daynight/test/commands/completion/shell-module.py --shell all
      - name: Exercise actual Tab completion in Bash 4.2, modern Bash and zsh
        id: completion-validation
        run: pnpm completion:acceptance
      - name: Upload shell completion evidence
        if: ${{ always() && steps.completion-validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-completion-acceptance
          path: .tmp/completion-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-completion
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-server:
    name: verify (Go server)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-cache
      GOMODCACHE: ${{ github.workspace }}/packages/daynight-server/.tmp/go-mod
      GOPATH: ${{ github.workspace }}/packages/daynight-server/.tmp/go
      GOBIN: ${{ github.workspace }}/packages/daynight-server/.tmp/bin
      TMPDIR: ${{ github.workspace }}/packages/daynight-server/.tmp/tmp
      XDG_CONFIG_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/config
      XDG_CACHE_HOME: ${{ github.workspace }}/packages/daynight-server/.tmp/cache
      GOENV: "off"
      GOTOOLCHAIN: go1.27.2
      DAYNIGHT_TEST_DATABASE_URL: postgres://daynight:daynight-test@127.0.0.1:5432/daynight?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: daynight
          POSTGRES_PASSWORD: daynight-test
          POSTGRES_DB: daynight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daynight -d daynight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: packages/daynight-server
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare module-local tool directories
        run: mkdir -p .tmp/go-cache .tmp/go-mod .tmp/go .tmp/bin .tmp/tmp .tmp/config .tmp/cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: packages/daynight-server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - name: Validate Go module tests and coverage
        id: server-validation
        run: bash scripts/check.sh --coverage
      - name: Upload Go coverage evidence
        if: ${{ always() && steps.server-validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-server-acceptance
          path: packages/daynight-server/coverage.out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-server
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-web-quality:
    name: verify (web quality)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Verify Web types, production build, harness and coverage
        id: web-quality
        run: node packages/daynight-web/scripts/ci.mts quality
      - name: Upload complete web coverage evidence
        if: ${{ always() && steps.web-quality.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-web-coverage
          path: |
            packages/daynight-web/.tmp/coverage/coverage-final.json
            packages/daynight-web/.tmp/coverage/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-web-quality
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-web-browser:
    name: verify (web browser)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
      - name: Install the locked Playwright Chromium browser
        run: pnpm --filter @codetreker/daynight-web exec playwright install --with-deps chromium
      - name: Verify frontend assistant browser regressions
        id: web-browser
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/packages/daynight-web/.tmp/acceptance/bots-viewport-results.xml
        run: pnpm --filter @codetreker/daynight-web exec playwright test --config tests/navigation/bots-viewport-playwright.config.ts --reporter=line,junit
      - name: Upload frontend assistant browser evidence
        if: ${{ always() && steps.web-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-web-assistant-browser
          path: |
            packages/daynight-web/.tmp/acceptance/bots-viewport-results.xml
            packages/daynight-web/.tmp/acceptance/bots-viewport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-web-browser
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-e2e:
    name: verify (product E2E)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright-browsers
      DAYNIGHT_E2E_RUN_POINTER: ${{ github.workspace }}/.tmp/product-e2e-run.json
      GOCACHE: ${{ github.workspace }}/.tmp/product-e2e-cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.tmp/product-e2e-cache/go-mod
      GOPATH: ${{ github.workspace }}/.tmp/product-e2e-cache/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 2
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 2
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - name: Prepare product E2E build caches
        timeout-minutes: 1
        run: mkdir -p .tmp/product-e2e-cache/go-build .tmp/product-e2e-cache/go-mod .tmp/product-e2e-cache/go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 3
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: |
            packages/daynight-server/go.sum
            packages/e2e_tests/src/build.ts
      - run: pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
        timeout-minutes: 3
      - name: Install the locked product E2E Chromium browser
        timeout-minutes: 4
        run: pnpm --filter @codetreker/daynight-e2e exec playwright install --with-deps chromium
      - name: Verify product E2E types
        timeout-minutes: 1
        run: pnpm --filter @codetreker/daynight-e2e typecheck
      - name: Verify product E2E harness behavior
        timeout-minutes: 1
        run: pnpm e2e:test:harness
      - name: Verify the complete isolated product journey
        id: product-e2e
        timeout-minutes: 15
        run: pnpm e2e:test
      - name: Reconcile product E2E resources after execution
        if: ${{ always() && steps.product-e2e.outcome != 'skipped' }}
        timeout-minutes: 3
        run: pnpm e2e:cleanup
      - name: Upload product E2E evidence
        timeout-minutes: 1
        if: ${{ always() && steps.product-e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-product-e2e
          path: |
            .tmp/product-e2e/*/results/**
            .tmp/product-e2e/*/logs/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        timeout-minutes: 1
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynight-image-test-pairs-verify-e2e
          path: .tmp/image-test-pairs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  checks:
    if: ${{ always() }}
    needs: [detect-changes, verify, verify-installed, verify-runtime, verify-completion, verify-server, verify-web-quality, verify-web-browser, verify-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require preceding jobs to succeed or be skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'all(.[]; . == "success" or . == "skipped")' <<< "$JOB_RESULTS"
      - name: Require selected Web jobs to succeed
        if: ${{ needs.detect-changes.outputs.web == 'true' }}
        env:
          WEB_QUALITY_RESULT: ${{ needs.verify-web-quality.result }}
          WEB_BROWSER_RESULT: ${{ needs.verify-web-browser.result }}
        run: test "$WEB_QUALITY_RESULT" = success && test "$WEB_BROWSER_RESULT" = success
      - name: Require selected product E2E to succeed
        if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
        env:
          E2E_RESULT: ${{ needs.verify-e2e.result }}
        run: test "$E2E_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and materialize protected image test inputs
        id: image-pairs
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_EVENT: ${{ github.event_name }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/image-test-pairs.mts
      - name: Download pairing evidence for detect-changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-detect-changes
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-detect-changes
      - name: Download pairing evidence for verify-ubuntu-latest
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-ubuntu-latest
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-ubuntu-latest
      - name: Download pairing evidence for verify-windows-latest
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-windows-latest
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-windows-latest
      - name: Download pairing evidence for verify-installed-ubuntu-latest
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-installed-ubuntu-latest
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-installed-ubuntu-latest
      - name: Download pairing evidence for verify-installed-windows-latest
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-installed-windows-latest
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-installed-windows-latest
      - name: Download pairing evidence for verify-macos-15
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-macos-15
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-macos-15
      - name: Download pairing evidence for verify-installed-macos-15
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-installed-macos-15
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-installed-macos-15
      - name: Download pairing evidence for verify-runtime-22.14.0
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-runtime-22.14.0
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-runtime-22.14.0
      - name: Download pairing evidence for verify-runtime-22
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-runtime-22
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-runtime-22
      - name: Download pairing evidence for verify-runtime-24
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-runtime-24
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-runtime-24
      - name: Download pairing evidence for verify-runtime-node
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-runtime-node
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-runtime-node
      - name: Download pairing evidence for verify-completion
        if: ${{ needs.detect-changes.outputs.cli == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-completion
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-completion
      - name: Download pairing evidence for verify-server
        if: ${{ needs.detect-changes.outputs.server == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-server
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-server
      - name: Download pairing evidence for verify-web-quality
        if: ${{ needs.detect-changes.outputs.web == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-web-quality
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-web-quality
      - name: Download pairing evidence for verify-web-browser
        if: ${{ needs.detect-changes.outputs.web == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-web-browser
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-web-browser
      - name: Download pairing evidence for verify-e2e
        if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynight-image-test-pairs-verify-e2e
          path: .tmp/image-pair-jobs/daynight-image-test-pairs-verify-e2e
      - name: Verify pairing evidence from every selected job
        env:
          IMAGE_PAIR_MANIFEST_COMMIT: ${{ needs.detect-changes.outputs.image_pair_manifest_commit }}
          IMAGE_PAIR_EXPECTED_COMBINED_TREE: ${{ needs.detect-changes.outputs.image_pair_combined_tree }}
          IMAGE_PAIR_COMBINED_COMMIT: ${{ needs.detect-changes.outputs.image_pair_combined_commit }}
          IMAGE_PAIR_PRODUCTION_TREE: ${{ needs.detect-changes.outputs.image_pair_production_tree }}
          IMAGE_PAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_PAIR_CLI: ${{ needs.detect-changes.outputs.cli }}
          IMAGE_PAIR_SERVER: ${{ needs.detect-changes.outputs.server }}
          IMAGE_PAIR_WEB: ${{ needs.detect-changes.outputs.web }}
          IMAGE_PAIR_E2E: ${{ needs.detect-changes.outputs.e2e }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          for (const field of ['IMAGE_PAIR_MANIFEST_COMMIT', 'IMAGE_PAIR_EXPECTED_COMBINED_TREE', 'IMAGE_PAIR_COMBINED_COMMIT', 'IMAGE_PAIR_PRODUCTION_TREE', 'IMAGE_PAIR_HEAD']) assert.match(process.env[field], /^[0-9a-f]{40}$/, field);
          for (const field of ['IMAGE_PAIR_CLI', 'IMAGE_PAIR_SERVER', 'IMAGE_PAIR_WEB', 'IMAGE_PAIR_E2E']) assert.ok(['true', 'false'].includes(process.env[field]), field);
          const expected = ['detect-changes'];
          if (process.env.IMAGE_PAIR_CLI === 'true') expected.push('verify-ubuntu-latest', 'verify-windows-latest', 'verify-installed-ubuntu-latest', 'verify-installed-windows-latest', 'verify-macos-15', 'verify-installed-macos-15', 'verify-runtime-22.14.0', 'verify-runtime-22', 'verify-runtime-24', 'verify-runtime-node', 'verify-completion');
          if (process.env.IMAGE_PAIR_SERVER === 'true') expected.push('verify-server');
          if (process.env.IMAGE_PAIR_WEB === 'true') expected.push('verify-web-quality', 'verify-web-browser');
          if (process.env.IMAGE_PAIR_E2E === 'true') expected.push('verify-e2e');
          const root = '.tmp/image-pair-jobs';
          const names = expected.map(name => `daynight-image-test-pairs-${name}`);
          assert.deepEqual(readdirSync(root).sort(), names.sort(), 'Every selected job must provide exactly one pairing receipt.');
          for (const name of names) {
            const evidence = JSON.parse(readFileSync(`${root}/${name}/image-test-pairs.json`, 'utf8'));
            assert.equal(evidence.schemaVersion, 1);
            assert.equal(evidence.manifestCommit, process.env.IMAGE_PAIR_MANIFEST_COMMIT, name);
            assert.equal(evidence.combinedTree, process.env.IMAGE_PAIR_EXPECTED_COMBINED_TREE, name);
            assert.equal(evidence.combinedCommit, process.env.IMAGE_PAIR_COMBINED_COMMIT, name);
            assert.equal(evidence.productionTree, process.env.IMAGE_PAIR_PRODUCTION_TREE, name);
            assert.equal(evidence.head, process.env.IMAGE_PAIR_HEAD, name);
          }
          console.log(JSON.stringify({ manifestCommit: process.env.IMAGE_PAIR_MANIFEST_COMMIT, combinedTree: process.env.IMAGE_PAIR_EXPECTED_COMBINED_TREE, productionTree: process.env.IMAGE_PAIR_PRODUCTION_TREE, jobs: expected }));
          NODE
