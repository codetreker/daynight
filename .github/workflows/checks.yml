          path: packages/daynight-web/.tmp/acceptance/*/evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload protected image test input evidence
        if: ${{ always() && steps.image-pairs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
