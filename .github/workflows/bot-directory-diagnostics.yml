name: Bot directory diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/bot-directory-diagnostics.yml'
      - 'packages/daynight/scripts/*bot*directory*'
      - 'packages/daynight/vitest.bot-directory-diagnostic.config.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directory-evidence:
    name: diagnose original Windows Bot directory cleanup
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      COREPACK_HOME: ${{ github.workspace }}/.tmp/corepack
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      BOT_DIRECTORY_DIAGNOSTIC_OUTPUT: ${{ github.workspace }}/.tmp/bot-directory-diagnostic
      BOT_FIXTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BOT_DIRECTORY_DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha }}
      BOT_DIRECTORY_DIAGNOSTIC_SOURCE_KIND: pull-request-head
      BOT_DIRECTORY_DIAGNOSTIC_PROFILE: full-normal-cli-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 1
        with:
          version: 11.28.6
          run_install: false
          dest: ${{ github.workspace }}/.tmp/pnpm
      - name: Install locked CLI dependencies, validate filters and build
        timeout-minutes: 1
        run: |
          pnpm install --frozen-lockfile --store-dir .tmp/pnpm-store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packages/daynight/scripts/test_bot_directory_etw.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
      - name: Capture the native control and one normal CLI context
        timeout-minutes: 18
        run: node packages/daynight/scripts/diagnose-bot-directory-release.mjs
      - name: Independently close the owned trace and restore fixture bytes
        if: always()
        timeout-minutes: 2
        run: node packages/daynight/scripts/diagnose-bot-directory-release.mjs --cleanup
      - name: Upload filtered diagnostic evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-directory-evidence
          path: .tmp/bot-directory-diagnostic/results/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
