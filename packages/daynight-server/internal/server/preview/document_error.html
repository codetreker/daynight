<!doctype html>
<html lang="{{.Language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <style>
    * { box-sizing: border-box; }
    body { min-width: 0; margin: 0; padding: 15px; background: white; font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { color: #9b4651; overflow-wrap: anywhere; background: #fff6f7; border: 1px solid #ecd4d8; border-radius: 7px; padding: 12px 15px; font-size: 12px; }
    p { margin: 0; }
    .request { margin-top: 5px; font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 11px; }
    a { display: inline-flex; padding: 8px 13px; border: 1px solid #dce0e8; border-radius: 7px; background: white; color: #37445b; text-decoration: none; }
    a:focus-visible { outline: 3px solid #8c8cf0; outline-offset: 3px; }
  </style>
</head>
<body><main role="alert">
  <p>{{.Message}}</p>
  <p class="request">{{.RequestLabel}}: <code>{{.RequestID}}</code></p>
  <div class="actions"><a id="retry" href="">{{.RetryLabel}}</a>
  {{if .NeedsLogin}}<a href="{{.Login}}" target="_blank" rel="noopener noreferrer">{{.LoginLabel}}</a>{{end}}</div>
</main><script>{{.RetryScript}}</script></body>
</html>
