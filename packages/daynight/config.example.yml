# Shared CLI configuration: $DN_CONFIG_DIR/config.yml (default ~/.daynight/config.yml).
# Select the sections needed for your commands and replace the example repositories
# and local paths. Merge settings into an existing file to retain credentials and
# other configuration; this file is a reference, not an automatically loaded config.

# Service origin only: no API path, query, credentials or fragment.
serverUrl: https://daynight.cc
# Prefer daynight login, which saves the credential for the selected service.
# For unattended provisioning, replace this placeholder with that origin's secret.
# serverToken: REPLACE_WITH_CREDENTIAL_FOR_THIS_ORIGIN
# Remove or replace an old token before changing serverUrl manually. Keep secrets
# out of repositories and logs; files containing a token need POSIX mode 0600.

# Optional default Team per normalized service origin and account UUID. Prefer
# `daynight team default set <uuid|personal>` to validate and save a selection.
# An absent entry uses the account's Personal Team; a saved value is a Team UUID.
# teamDefaults:
#   https://daynight.cc:
#     80be22c3-96d8-4ed1-bcd3-b820f2508c62: b95baeff-1522-4d99-a9b4-dfcb58392eca

# Optional Agent-only CLI mappings (macOS/Linux), disabled when omitted or {}.
# Keys are commands the Agent uses; values are executable names or absolute paths.
# Only new Worker/Controller Agent environments receive these aliases.
# agentCliAliases:
#   daynight: daynight-dev
#   dn: daynight-dev

# Review configuration. The numeric values below are the defaults; all are positive
# integers, and fields ending in Ms use milliseconds.
# Only repositoryRoot expands ~. It selects paths for future review add-repo calls
# without --path and does not relocate repositories already registered below.
review:
  repositoryRoot: ~/daynights
  pollIntervalMs: 60000
  maxConcurrentWorker: 1
  agentTimeoutMs: 1800000
  maxAttempts: 3
  retryDelayMs: 30000
  # Optional review overrides, not defaults. Omission preserves Copilot's choices.
  # Copilot owns supported model names, effort levels and their compatibility.
  # copilotModel: auto
  # copilotReasoningEffort: high
  repositories:
    - remote: https://github.com/OWNER/REPO.git
      # Repository paths are absolute or relative to the selected config directory, never the launch
      # directory, and do not expand ~. Keep review clones outside that directory.
      path: ../daynights/github.com/owner/repo

# Worker local settings and first-import seed. Optional daynight worker setup
# inspects prerequisites and selects an agent and existing Projects before the
# first connection. The seed is imported only when the cloud target is absent.
# Afterwards, My Workers owns concurrency, polling/recovery limits, Project
# selection and global/per-Project agent/model/args. Local managed values cannot
# overwrite that target. Normal worker run accepts an empty selection and does
# not open a Project picker.
# Paths, identity, service credentials and agentControlMode remain local. Native
# credentials and the official Herdr integration must be configured explicitly.
# Every fresh/resumed native agent uses fixed full access and task-folder trust;
# args cannot lower that policy or re-enable permission prompts. The fixed launch
# policy does not edit provider global settings.
worker:
  # Root for new Worker repository paths; independent of review's root.
  # Changing it does not relocate an existing local binding.
  repositoryRoot: ~/daynights
  # Initial cloud values. maxConcurrent and pollIntervalMs are positive integers;
  # pollIntervalMs uses milliseconds, and recoveryLimit is nonnegative.
  maxConcurrent: 1
  pollIntervalMs: 60000
  recoveryLimit: 3
  # Local choice: herdr for terminal control or web for the Task Session page.
  # The service freezes this mode per claim; it is not a cloud-managed setting.
  agentControlMode: herdr
  # Initial global native values. Later changes belong in My Workers.
  agent: copilot
  model: null
  args: []
  # Initial Project selection and native overrides become cloud configuration.
  # Local transports/paths remain bindings; they do not choose the cloud scope.
  # Existing native processes retain their launch parameters. Herdr restarts use
  # current applicable values; Web recovery keeps its frozen execution record.
  repositories:
    - remote: https://github.com/OWNER/REPO.git
      # Paths follow the same config-directory-relative rule as review paths.
      # Worker repository paths must not overlap each other or ~/.daynight/.
      path: ../code/repo
      # The matching Daynight project must exist. Set its actual UUID when remote
      # discovery matches more than one project.
      # projectId: REPLACE_WITH_MATCHING_PROJECT_UUID
      # Native overrides inherit fields independently for the same agent.
      # Switching agent clears inherited model and args unless set here. Explicit
      # null model or [] args clears that field; args replaces the entire list.
      # Omission remains inheritance when the first-import seed is projected.
      # agent: codex
      # model: null
      # args: []

# workerId is generated and saved by the CLI. Keep its existing value for this
# worker; do not copy another machine's identity into this configuration.
